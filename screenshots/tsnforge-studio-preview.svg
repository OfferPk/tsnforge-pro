<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#headerGrad)"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#2e3856" stroke-width="1.5"/>

  <!-- Logo Icon -->
  <rect x="32" y="16" width="48" height="48" rx="10" fill="url(#accent)"/>
  <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0b0f19" text-anchor="middle">TSN</text>

  <!-- Title -->
  <text x="96" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff">TSNForge Pro <tspan font-size="14" fill="#94a3b8" font-weight="normal">v1.0.0</tspan></text>
  <text x="96" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">IEEE 802.1Qbv Time-Aware Shaper, 802.1Qbu Preemption &amp; GCL Synthesis Studio</text>

  <!-- Header Badges -->
  <rect x="880" y="26" width="140" height="28" rx="6" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
  <text x="950" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">IEEE 802.1Qbv CERTIFIED</text>

  <rect x="1035" y="26" width="130" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="1100" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">802.1Qbu ACTIVE</text>

  <!-- Top Metric Cards -->
  <g transform="translate(32, 105)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="265" height="75" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="132" y="36" font-family="monospace" font-size="26" font-weight="800" fill="#00f2fe" text-anchor="middle">1000 µs</text>
    <text x="132" y="58" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">BASE CYCLE TIME</text>

    <!-- Card 2 -->
    <rect x="290" y="0" width="265" height="75" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="422" y="36" font-family="monospace" font-size="26" font-weight="800" fill="#4facfe" text-anchor="middle">9.0%</text>
    <text x="422" y="58" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">SCHEDULED TRAFFIC (ST) BW</text>

    <!-- Card 3 -->
    <rect x="580" y="0" width="265" height="75" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="712" y="36" font-family="monospace" font-size="26" font-weight="800" fill="#10b981" text-anchor="middle">+94.8%</text>
    <text x="712" y="58" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">GUARD BAND SHRINKAGE (802.1Qbu)</text>

    <!-- Card 4 -->
    <rect x="870" y="0" width="265" height="75" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="1002" y="36" font-family="monospace" font-size="26" font-weight="800" fill="#f59e0b" text-anchor="middle">909.4 Mbps</text>
    <text x="1002" y="58" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">GUARANTEED BEST-EFFORT TP</text>
  </g>

  <!-- GCL Timeline View Card -->
  <g transform="translate(32, 205)">
    <rect x="0" y="0" width="1135" height="150" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Gate Control List (GCL) Time-Aware Transmission Window (0 µs → 1000 µs)</text>

    <!-- Timeline Bar -->
    <g transform="translate(24, 52)">
      <!-- ST Slot 1 (0 to 50 us -> 5% = 54.3px) -->
      <rect x="0" y="0" width="54" height="42" fill="url(#accent)" rx="4"/>
      <text x="27" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0f19" text-anchor="middle">ST1</text>

      <!-- BE Slot (50 to 199.4 us -> 149.4 us = 162.4px) -->
      <rect x="58" y="0" width="162" height="42" fill="#10b981" rx="4"/>
      <text x="139" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0f19" text-anchor="middle">Best Effort (TC0-TC5)</text>

      <!-- Guard Band (199.4 to 200 us -> tiny red line) -->
      <rect x="224" y="0" width="8" height="42" fill="#ef4444" rx="2"/>

      <!-- ST Slot 2 (200 to 240 us -> 40 us = 43.5px) -->
      <rect x="236" y="0" width="44" height="42" fill="#4facfe" rx="4"/>
      <text x="258" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0f19" text-anchor="middle">ST2</text>

      <!-- BE Slot 2 (240 to 1000 us -> 760 us = 800px) -->
      <rect x="284" y="0" width="803" height="42" fill="#10b981" rx="4"/>
      <text x="685" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0f19" text-anchor="middle">Best Effort Async Transmissions (TC0-TC5 Open / 760 µs)</text>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="14" height="14" fill="#00f2fe" rx="3"/>
      <text x="22" y="12" font-family="sans-serif" font-size="12" fill="#9ca3af">Scheduled Traffic (TC7/TC6)</text>

      <rect x="240" y="0" width="14" height="14" fill="#ef4444" rx="3"/>
      <text x="262" y="12" font-family="sans-serif" font-size="12" fill="#9ca3af">Guard Band (Preempted)</text>

      <rect x="460" y="0" width="14" height="14" fill="#10b981" rx="3"/>
      <text x="482" y="12" font-family="sans-serif" font-size="12" fill="#9ca3af">Best Effort Background (TC0-TC5)</text>
    </g>
  </g>

  <!-- Lower Left: 10-Point Auditor Card -->
  <g transform="translate(32, 380)">
    <rect x="0" y="0" width="555" height="265" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">10-Point Determinism Auditor</text>
    <text x="530" y="32" font-family="monospace" font-size="18" font-weight="800" fill="#10b981" text-anchor="end">100 / 100 PASSED</text>

    <!-- Audit Item 1 -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PASS</text>
      <text x="75" y="14" font-family="sans-serif" font-size="12" fill="#f3f4f6">TSN-01: IEEE 802.1AS gPTP Clock Synchronization (&lt;100 ns)</text>
    </g>
    <!-- Audit Item 2 -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PASS</text>
      <text x="75" y="14" font-family="sans-serif" font-size="12" fill="#f3f4f6">TSN-02: 802.1Qbv Guard Band Clearance Margin (0.64 µs)</text>
    </g>
    <!-- Audit Item 3 -->
    <g transform="translate(24, 125)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PASS</text>
      <text x="75" y="14" font-family="sans-serif" font-size="12" fill="#f3f4f6">TSN-03: Zero-Queuing Delay on Isochronous ST Slots</text>
    </g>
    <!-- Audit Item 4 -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PASS</text>
      <text x="75" y="14" font-family="sans-serif" font-size="12" fill="#f3f4f6">TSN-04: 802.1Qbu Preemption &amp; mPacket Fragment Bounds</text>
    </g>
    <!-- Audit Item 5 -->
    <g transform="translate(24, 195)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PASS</text>
      <text x="75" y="14" font-family="sans-serif" font-size="12" fill="#f3f4f6">TSN-09: Worst-Case Response Time (WCRT) Deadline Satisfaction</text>
    </g>
  </g>

  <!-- Lower Right: NETCONF YANG Code Export -->
  <g transform="translate(612, 380)">
    <rect x="0" y="0" width="555" height="265" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">IEEE 802.1Qcp YANG &amp; Linux tc-taprio Export</text>

    <!-- Code Block -->
    <rect x="24" y="48" width="507" height="195" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="40" y="74" font-family="monospace" font-size="11" fill="#7ee787">&lt;dot1q:gate-parameters&gt;</text>
    <text x="56" y="94" font-family="monospace" font-size="11" fill="#79c0ff">  &lt;dot1q:gate-enabled&gt;true&lt;/dot1q:gate-enabled&gt;</text>
    <text x="56" y="114" font-family="monospace" font-size="11" fill="#79c0ff">  &lt;dot1q:admin-cycle-time&gt;1000000 ns&lt;/dot1q:admin-cycle-time&gt;</text>
    <text x="56" y="134" font-family="monospace" font-size="11" fill="#d2a8ff">  &lt;dot1q:gate-control-entry&gt;</text>
    <text x="72" y="154" font-family="monospace" font-size="11" fill="#e6edf3">    &lt;operation-name&gt;set-gate-states&lt;/operation-name&gt;</text>
    <text x="72" y="174" font-family="monospace" font-size="11" fill="#ffa657">    &lt;gate-state-value&gt;10000000&lt;/gate-state-value&gt; &lt;!-- TC7 OPEN --&gt;</text>
    <text x="72" y="194" font-family="monospace" font-size="11" fill="#ffa657">    &lt;time-interval-value&gt;50000 ns&lt;/time-interval-value&gt;</text>
    <text x="56" y="214" font-family="monospace" font-size="11" fill="#d2a8ff">  &lt;/dot1q:gate-control-entry&gt;</text>
    <text x="40" y="234" font-family="monospace" font-size="11" fill="#7ee787">&lt;/dot1q:gate-parameters&gt;</text>
  </g>
</svg>
